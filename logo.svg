<svg viewBox="0 0 1400 512" xmlns="http://www.w3.org/2000/svg" width="200" height="80">
  <!-- Left wave with circle -->
  <g>
    <!-- Dark navy wave left -->
    <path d="M 80 250 Q 150 150 250 200 Q 320 240 350 420 L 0 420 Q 0 350 80 250" fill="#102A43"/>
    <!-- Lower dark navy wave -->
    <path d="M 0 420 Q 80 450 180 380 Q 280 300 350 420 L 0 420" fill="#102A43"/>
    <!-- Yellow circle left -->
    <circle cx="180" cy="280" r="45" fill="#F59E0B"/>
  </g>
  
  <!-- Middle swoosh -->
  <g>
    <!-- Main dark navy swoosh -->
    <path d="M 350 420 Q 550 200 750 150 Q 900 120 1000 200 Q 1050 250 1000 350" fill="#102A43" stroke="none"/>
    <!-- Top curve white -->
    <path d="M 350 280 Q 500 180 700 220 Q 850 260 950 300" stroke="white" stroke-width="45" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Right number 9 -->
  <g>
    <!-- Top circle of 9 -->
    <circle cx="1150" cy="180" r="90" fill="#102A43"/>
    <!-- White inner space top -->
    <circle cx="1150" cy="180" r="60" fill="white"/>
    <!-- Bottom stem of 9 -->
    <rect x="1095" y="270" width="110" height="170" rx="55" fill="#102A43"/>
    <!-- Yellow accent circle top -->
    <circle cx="1280" cy="120" r="35" fill="#F59E0B"/>
    <!-- White cutout right -->
    <ellipse cx="1190" cy="280" rx="50" ry="60" fill="white"/>
  </g>
</svg>
